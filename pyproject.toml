[project]
name = "races"
version = "0.1.0"
description = "World trail and road race calendar aggregator"
authors = [{ name = "sanchpet" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pycountry>=26.2.16",
    "pyyaml>=6.0.3",
]

[project.scripts]
races = "races.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
