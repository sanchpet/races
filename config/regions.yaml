# Region groups for the site's filter. Edit freely: a group is a label plus a list
# of ISO 3166-1 alpha-2 country codes, and a country may sit in several groups.
# Groups appear in the filter in this order. Kosovo uses the user-assigned XK.
# Quote "NO" (Norway): bare NO is a boolean in YAML.

cyprus-neighbours:
  label: Cyprus & neighbours
  countries: [CY, GR, TR, IL, LB, EG, SY, JO, PS]

georgia-caucasus:
  label: Georgia & Caucasus
  countries: [GE, AM, AZ, TR]

