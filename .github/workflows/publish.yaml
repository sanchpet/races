name: Publish

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch:
        description: Fetch sources before building
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # The GeoNames dump changes slowly; refresh it weekly instead of on every run.
      # Push builds need it too when a pick defines its own race without lat/lon.
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/geonames
          key: geonames-${{ steps.week.outputs.week }}

      - name: Fetch sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch)
        run: |
          set -o pipefail
          uv run races fetch | tee fetch.log
          { echo '## Fetch'; echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --signoff -m "chore(data): refresh events"
          git pull -q --rebase origin main
          git push origin HEAD:main

      - name: Build
        run: uv run races build --out dist

      # The garden's build checks this branch out, so a single commit keeps that checkout small.
      - name: Push the feed to the public branch
        working-directory: dist
        run: |
          source=$(git -C .. rev-parse --short HEAD)
          git init -q -b public
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Feed from races ${source}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" public

      # A push made with the workflow's own token starts no workflow elsewhere, so ask for the rebuild.
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GARDEN_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GARDEN_DISPATCH_TOKEN is not set: the site keeps the previous feed until its next build."
            exit 0
          fi
          gh api repos/sanchpet/garden/dispatches -f event_type=races-feed
